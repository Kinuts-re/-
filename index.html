<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Призма Мебель — конструктор мягкой мебели</title>
<style>
  :root {
    --brand: #b5793c;
    --brand-dark: #8a5a26;
    --ink: #2b2b2b;
    --muted: #888;
    --line: #e5e1da;
    --bg: #f6f4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  
  header { background: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo-mark { width: 34px; height: 34px; background: var(--brand); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .logo-text { font-weight: 700; font-size: 19px; letter-spacing: -0.5px; }
  .logo-text small { display: block; font-size: 10px; letter-spacing: 3px; color: var(--brand); font-weight: 600; }
  
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .hero { background: linear-gradient(135deg, #fff 0%, #faf6ef 100%); border-radius: 20px; padding: 40px 32px; margin-bottom: 32px; border: 1px solid var(--line); text-align: center; }
  .hero h1 { font-size: 34px; margin-bottom: 12px; }
  .hero h1 span { color: var(--brand); }
  .hero p { color: #666; font-size: 16px; }

  .configurator { display: grid; grid-template-columns: 1fr 420px; gap: 24px; background: #fff; border-radius: 16px; padding: 24px; border: 1px solid var(--line); margin-bottom: 40px; }
  @media (max-width: 1000px) { .configurator { grid-template-columns: 1fr; padding: 12px; } }

  /* CSS 3D ВЬЮВЕР */
  #viewer { background: linear-gradient(180deg, #faf9f7 0%, #eeebe5 100%); border-radius: 12px; min-height: 500px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; perspective: 1200px; }
  .hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #888; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; pointer-events: none; z-index: 10; }
  .viewer-title { position: absolute; top: 12px; left: 12px; font-size: 13px; color: #666; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; z-index: 10; }
  
  .scene { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
  .sofa-container { position: absolute; left: 50%; top: 55%; transform-style: preserve-3d; transform: translate(-50%, -50%) rotateX(-20deg) rotateY(-30deg); }
  
  .face { position: absolute; background: #8e8e8e; border: 1px solid rgba(0,0,0,0.1); box-shadow: inset 0 0 20px rgba(0,0,0,0.05); }
  .top { transform: rotateX(90deg) translateZ(var(--h)); width: var(--w); height: var(--d); left: 0; top: calc(var(--d) / -2); }
  .front { transform: rotateY(0deg) translateZ(calc(var(--d) / 2)); width: var(--w); height: var(--h); left: 0; top: calc(var(--h) / -2); }
  .right { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); width: var(--d); height: var(--h); left: calc(var(--w) / -2 + var(--w) / 2); top: calc(var(--h) / -2); }

  .panel { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-height: 700px; padding-right: 4px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }

  .model-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .model-btn { padding: 10px; border: 2px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; font-family: inherit; }
  .model-btn:hover { border-color: #c9b79a; }
  .model-btn.active { border-color: var(--brand); background: #fdf6ee; color: var(--brand-dark); font-weight: 600; }

  .slider-group { margin-bottom: 12px; }
  .slider-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .slider-group label span { color: var(--brand); font-weight: 600; }
  .slider-group input[type=range] { width: 100%; accent-color: var(--brand); }

  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch.active { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }

  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .option-btn { padding: 10px 12px; border: 2px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: all .15s; font-family: inherit; width: 100%; }
  .option-btn:hover { border-color: #c9b79a; }
  .option-btn.active { border-color: var(--brand); background: #fdf6ee; }
  .option-btn .price-tag { color: var(--brand); font-size: 12px; font-weight: 600; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 8px; }
  .checkbox-row:hover { background: #faf8f5; }
  .checkbox-row input { accent-color: var(--brand); width: 18px; height: 18px; cursor: pointer; }
  .checkbox-row .opt-price { margin-left: auto; color: var(--brand); font-size: 12px; font-weight: 600; }

  .price-box { position: sticky; bottom: 0; background: var(--ink); color: #fff; padding: 18px; border-radius: 12px; margin-top: auto; }
  .price-total { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
  .price-breakdown { font-size: 12px; color: #aaa; line-height: 1.6; margin-bottom: 12px; }
  .order-btn { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .order-btn:hover { background: var(--brand-dark); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 32px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; font-size: 22px; }
  .modal input, .modal textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal-summary { background: var(--bg); padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 13px; line-height: 1.7; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #eee; color: #555; }
  .btn-submit { background: var(--brand); color: #fff; }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-mark"></div>
    <div class="logo-text">ПРИЗМА<small>МЕБЕЛЬ</small></div>
  </a>
</header>

<div class="container">
  <section class="hero">
    <h1>Соберите диван <span>своей мечты</span></h1>
    <p>Выбирайте модель, размеры, ткань и наполнение — мы покажем цену и сошьём под вас.</p>
  </section>

  <section class="configurator">
    <div id="viewer">
      <div class="viewer-title" id="viewerTitle">Прямой диван «Осло»</div>
      <div class="hint">🖱️ Зажмите и потяните мышкой, чтобы вращать</div>
      
      <!-- Контейнер для 3D-модели (на CSS) -->
      <div class="scene" id="scene">
        <div class="sofa-container" id="sofaContainer">
          <!-- Модель будет генерироваться здесь -->
        </div>
      </div>
      
    </div>

    <div class="panel">
      <div>
        <h3>Модель</h3>
        <div class="model-selector" id="modelSelector"></div>
      </div>

      <div>
        <h3>Размеры</h3>
        <div class="slider-group">
          <label>Ширина <span id="wVal">220 см</span></label>
          <input type="range" id="width" min="160" max="320" step="10" value="220" />
        </div>
        <div class="slider-group">
          <label>Глубина <span id="dVal">95 см</span></label>
          <input type="range" id="depth" min="80" max="120" step="5" value="95" />
        </div>
        <div class="slider-group">
          <label>Высота спинки <span id="hVal">85 см</span></label>
          <input type="range" id="height" min="70" max="110" step="5" value="85" />
        </div>
      </div>

      <div>
        <h3>Цвет обивки</h3>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div>
        <h3>Ткань</h3>
        <div class="option-list" id="fabricList"></div>
      </div>

      <div>
        <h3>Наполнение</h3>
        <div class="option-list" id="fillerList"></div>
      </div>

      <div>
        <h3>Опции</h3>
        <div class="option-list">
          <label class="checkbox-row">
            <input type="checkbox" id="optArms" checked />
            Подлокотники <span class="opt-price">+3 000 ₽</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="optMechanism" />
            Механизм «еврокнижка» <span class="opt-price">+12 000 ₽</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="optStorage" />
            Ящик для белья <span class="opt-price">+6 000 ₽</span>
          </label>
        </div>
      </div>

      <div class="price-box">
        <div class="price-total" id="totalPrice">0 ₽</div>
        <div class="price-breakdown" id="breakdown"></div>
        <button class="order-btn" onclick="openOrder()">Оформить заказ</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ============ ДАННЫЕ ============ */
const MODELS = {
  straight: { name: 'Прямой диван', fullName: 'Прямой диван «Осло»', base: 35000, wMin: 160, wMax: 320, wDef: 220 },
  corner:   { name: 'Угловой диван', fullName: 'Угловой диван «Берген»', base: 52000, wMin: 200, wMax: 360, wDef: 280 },
  armchair: { name: 'Кресло', fullName: 'Кресло «Токио»', base: 22000, wMin: 80,  wMax: 140, wDef: 100 },
  sofaBed:  { name: 'Диван-кровать', fullName: 'Диван-кровать «Милан»', base: 42000, wMin: 180, wMax: 300, wDef: 240 },
};

const COLORS = [
  { id: 'gray',     name: 'Серый',      hex: '#8e8e8e' },
  { id: 'beige',    name: 'Бежевый',    hex: '#c9b79a' },
  { id: 'navy',     name: 'Синий',      hex: '#34495e' },
  { id: 'green',    name: 'Зелёный',    hex: '#5a7d5a' },
  { id: 'brown',    name: 'Коричневый', hex: '#6b4a2f' },
  { id: 'burgundy', name: 'Бордовый',   hex: '#7a2e3b' },
  { id: 'cream',    name: 'Кремовый',   hex: '#efe6d6' },
  { id: 'black',    name: 'Чёрный',     hex: '#2b2b2b' },
];

const FABRICS = [
  { id: 'rog',      name: 'Рогожка',  mult: 1.0 },
  { id: 'velvet',   name: 'Велюр',    mult: 1.25 },
  { id: 'chenille', name: 'Шенилл',   mult: 1.15 },
  { id: 'leather',  name: 'Экокожа',  mult: 1.4 },
  { id: 'linen',    name: 'Лён',      mult: 1.1 },
];

const FILLERS = [
  { id: 'ppu',    name: 'ППУ стандарт',            add: 0 },
  { id: 'spring', name: 'ППУ + пружины',           add: 4000 },
  { id: 'memory', name: 'Пружинный блок + память', add: 9000 },
];

/* ============ СОСТОЯНИЕ ============ */
const state = {
  model: 'straight', width: 220, depth: 95, height: 85,
  color: 'gray', fabric: 'rog', filler: 'ppu',
  arms: true, mechanism: false, storage: false,
};

/* ============ ВРАЩЕНИЕ 3D ============ */
const scene = document.getElementById('scene');
const sofaContainer = document.getElementById('sofaContainer');
let isDragging = false;
let prevX = 0, prevY = 0;
let rotX = -20, rotY = -30;

scene.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  rotY += dx * 0.5;
  rotX -= dy * 0.5;
  rotX = Math.max(-90, Math.min(90, rotX)); // Ограничение наклона
  prevX = e.clientX; prevY = e.clientY;
  updateViewer();
});

function updateViewer() {
  sofaContainer.style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
}

/* ============ 3D МОДЕЛЬ НА CSS ============ */
function rebuildSofa() {
  const colorHex = COLORS.find(c => c.id === state.color).hex;
  const w = state.width * 0.8; // Масштабируем для экрана
  const d = state.depth * 0.8;
  const h = state.height * 0.8;
  
  const seatH = 35;
  const seatD = d - 15;
  const backH = h - seatH;
  const armW = state.arms ? 20 : 0;
  const innerW = w - armW * 2;

  // Базовый стиль для всех блоков
  const boxStyle = `background: ${colorHex}; box-shadow: inset 0 0 15px rgba(0,0,0,0.15), 2px 2px 5px rgba(0,0,0,0.1); border-radius: 4px;`;

  let html = '';
  
  // Функция создания блока
  function createBlock(x, y, z, bw, bh, bd) {
    return `
      <div style="position: absolute; width: ${bw}px; height: ${bh}px; transform: translate3d(${x}px, ${y}px, ${z}px); transform-style: preserve-3d;">
        <!-- Передняя грань -->
        <div style="position: absolute; width: ${bw}px; height: ${bh}px; transform: translateZ(${bd/2}px); ${boxStyle}"></div>
        <!-- Задняя грань -->
        <div style="position: absolute; width: ${bw}px; height: ${bh}px; transform: rotateY(180deg) translateZ(${bd/2}px); ${boxStyle}"></div>
        <!-- Левая грань -->
        <div style="position: absolute; width: ${bd}px; height: ${bh}px; left: ${-bd/2 + bw/2}px; transform: rotateY(-90deg) translateZ(${bw/2}px); ${boxStyle}"></div>
        <!-- Правая грань -->
        <div style="position: absolute; width: ${bd}px; height: ${bh}px; left: ${-bd/2 + bw/2}px; transform: rotateY(90deg) translateZ(${bw/2}px); ${boxStyle}"></div>
        <!-- Верхняя грань -->
        <div style="position: absolute; width: ${bw}px; height: ${bd}px; top: ${-bd/2 + bh/2}px; transform: rotateX(90deg) translateZ(${bh/2}px); ${boxStyle}; filter: brightness(1.1);"></div>
        <!-- Нижняя грань -->
        <div style="position: absolute; width: ${bw}px; height: ${bd}px; top: ${-bd/2 + bh/2}px; transform: rotateX(-90deg) translateZ(${bh/2}px); ${boxStyle}; filter: brightness(0.8);"></div>
      </div>
    `;
  }

  if (state.model === 'corner') {
    const mainW = w * 0.62;
    const sideW = w - mainW;
    
    // Основная часть
    html += createBlock(0, 0, 0, mainW, seatH, d); // База
    html += createBlock(0, -seatH/2 - 20, 0, mainW, 40, d - 15); // Сиденье
    html += createBlock(0, -seatH/2 - backH/2 - 10, -d/2 + 10, mainW, backH, 20); // Спинка
    
    // Боковая часть
    html += createBlock(mainW/2 + sideW/2 - 5, 0, d*0.1, sideW, seatH, d*0.8); // База
    html += createBlock(mainW/2 + sideW/2 - 5, -seatH/2 - 20, d*0.1, sideW, 40, d*0.8 - 15); // Сиденье
    html += createBlock(mainW/2 + sideW/2 - 5, -seatH/2 - backH/2 - 10, d*0.1 - 10, sideW, backH, 20); // Спинка

  } else {
    // Прямой диван / кресло
    const baseY = seatH / 2;
    html += createBlock(0, baseY, 0, w, seatH, d); // База
    html += createBlock(0, 0, 5, innerW, 20, seatD); // Сиденье
    html += createBlock(0, -backH/2, -d/2 + 10, innerW, backH, 20); // Спинка

    if (state.arms) {
      html += createBlock(-w/2 + armW/2, -15, 0, armW, 60, d); // Левый подлокотник
      html += createBlock(w/2 - armW/2, -15, 0, armW, 60, d); // Правый подлокотник
    }
  }

  // Подушки на спинке
  if (state.model !== 'armchair') {
    const pillowW = 40;
    const pX = state.model === 'corner' ? -w*0.2 : (state.arms ? -w/2 + armW + 30 : -w/2 + 30);
    for (let i = 0; i < 2; i++) {
      html += createBlock(pX + i * (pillowW + 10), -seatH/2 - 20, -d/2 + 25, pillowW, 30, 15);
    }
  }

  sofaContainer.innerHTML = html;
}

/* ============ ЦЕНА ============ */
function calculatePrice() {
  const model = MODELS[state.model];
  const fabric = FABRICS.find(f => f.id === state.fabric);
  const filler = FILLERS.find(f => f.id === state.filler);

  const base = model.base;
  const sizeAdd = Math.max((state.width - model.wDef) * 80, 0) + 
                  Math.max((state.depth - 95) * 150, 0) + 
                  Math.max((state.height - 85) * 100, 0);
  
  const beforeFabric = base + sizeAdd;
  const afterFabric = beforeFabric * fabric.mult;
  const fabricAdd = Math.round(afterFabric - beforeFabric);

  const total = Math.round(afterFabric + filler.add + 
                (state.arms ? 3000 : 0) + 
                (state.mechanism ? 12000 : 0) + 
                (state.storage ? 6000 : 0));

  return { base, sizeAdd, fabricAdd, fillerAdd: filler.add, 
           armsAdd: state.arms ? 3000 : 0, mechAdd: state.mechanism ? 12000 : 0, 
           storageAdd: state.storage ? 6000 : 0, total };
}

function renderPrice() {
  const p = calculatePrice();
  document.getElementById('totalPrice').textContent = p.total.toLocaleString('ru-RU') + ' ₽';
  
  let b = [`Базовая: ${p.base.toLocaleString('ru-RU')} ₽`];
  if (p.sizeAdd > 0) b.push(`Размер: +${p.sizeAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fabricAdd > 0) b.push(`Ткань: +${p.fabricAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fillerAdd > 0) b.push(`Наполнение: +${p.fillerAdd.toLocaleString('ru-RU')} ₽`);
  if (p.armsAdd > 0) b.push(`Подлокотники: +${p.armsAdd.toLocaleString('ru-RU')} ₽`);
  if (p.mechAdd > 0) b.push(`Механизм: +${p.mechAdd.toLocaleString('ru-RU')} ₽`);
  if (p.storageAdd > 0) b.push(`Ящик: +${p.storageAdd.toLocaleString('ru-RU')} ₽`);

  document.getElementById('breakdown').innerHTML = b.join('<br>');
}

/* ============ UI РЕНДЕР ============ */
function renderUI() {
  // Модели
  const mCont = document.getElementById('modelSelector');
  mCont.innerHTML = '';
  Object.entries(MODELS).forEach(([id, m]) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn' + (state.model === id ? ' active' : '');
    btn.textContent = m.name;
    btn.onclick = () => {
      state.model = id;
      const wInput = document.getElementById('width');
      wInput.min = m.wMin; wInput.max = m.wMax;
      state.width = Math.min(Math.max(state.width, m.wMin), m.wMax);
      wInput.value = state.width;
      document.getElementById('wVal').textContent = state.width + ' см';
      document.getElementById('viewerTitle').textContent = m.fullName;
      renderUI(); rebuildSofa(); renderPrice();
    };
    mCont.appendChild(btn);
  });

  // Цвета
  const cCont = document.getElementById('colorGrid');
  cCont.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (state.color === c.id ? ' active' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    sw.onclick = () => { state.color = c.id; renderUI(); rebuildSofa(); };
    cCont.appendChild(sw);
  });

  // Ткани
  const fCont = document.getElementById('fabricList');
  fCont.innerHTML = '';
  FABRICS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (state.fabric === f.id ? ' active' : '');
    btn.innerHTML = `<span>${f.name}</span><span class="price-tag">${f.mult === 1 ? 'базовая' : '×'+f.mult}</span>`;
    btn.onclick = () => { state.fabric = f.id; renderUI(); rebuildSofa(); renderPrice(); };
    fCont.appendChild(btn);
  });

  // Наполнение
  const fillCont = document.getElementById('fillerList');
  fillCont.innerHTML = '';
  FILLERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (state.filler === f.id ? ' active' : '');
    btn.innerHTML = `<span>${f.name}</span><span class="price-tag">${f.add === 0 ? 'включено' : '+'+f.add.toLocaleString('ru-RU')+' ₽'}</span>`;
    btn.onclick = () => { state.filler = f.id; renderUI(); renderPrice(); };
    fillCont.appendChild(btn);
  });
}

/* ============ СОБЫТИЯ ============ */
document.getElementById('width').addEventListener('input', e => {
  state.width = +e.target.value;
  document.getElementById('wVal').textContent = state.width + ' см';
  rebuildSofa(); renderPrice();
});
document.getElementById('depth').addEventListener('input', e => {
  state.depth = +e.target.value;
  document.getElementById('dVal').textContent = state.depth + ' см';
  rebuildSofa(); renderPrice();
});
document.getElementById('height').addEventListener('input', e => {
  state.height = +e.target.value;
  document.getElementById('hVal').textContent = state.height + ' см';
  rebuildSofa(); renderPrice();
});
document.getElementById('optArms').addEventListener('change', e => {
  state.arms = e.target.checked; rebuildSofa(); renderPrice();
});
document.getElementById('optMechanism').addEventListener('change', e => {
  state.mechanism = e.target.checked; renderPrice();
});
document.getElementById('optStorage').addEventListener('change', e => {
  state.storage = e.target.checked; renderPrice();
});

/* ============ МОДАЛКА ============ */
const modal = document.getElementById('orderModal');
const modalContent = document.getElementById('modalContent');

window.openOrder = function() {
  const p = calculatePrice();
  const model = MODELS[state.model];
  const color = COLORS.find(c => c.id === state.color);
  
  modalContent.innerHTML = `
    <h2>Оформление заказа</h2>
    <input id="fName" placeholder="Имя" />
    <input id="fPhone" placeholder="Телефон" />
    <input id="fEmail" placeholder="Email (необязательно)" />
    <textarea id="fAddress" placeholder="Адрес доставки"></textarea>
    
    <div class="modal-summary">
      <div><b>Модель:</b> ${model.fullName}</div>
      <div><b>Размер:</b> ${state.width}×${state.depth}×${state.height} см</div>
      <div><b>Цвет:</b> ${color.name}</div>
      <div><b>Итого:</b> ${p.total.toLocaleString('ru-RU')} ₽</div>
    </div>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('orderModal').classList.remove('open')">Отмена</button>
      <button class="btn-submit" onclick="submitOrder()">Заказать</button>
    </div>
  `;
  modal.classList.add('open');
};

window.submitOrder = function() {
  const name = document.getElementById('fName').value;
  const phone = document.getElementById('fPhone').value;
  
  if (!name || !phone) { alert('Пожалуйста, заполните имя и телефон'); return; }
  
  const p = calculatePrice();
  const orderId = 'ПРЗ-' + Date.now().toString().slice(-6);
  
  modalContent.innerHTML = `
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 56px; margin-bottom: 12px;">✅</div>
      <h2>Спасибо, ${name}!</h2>
      <p>Ваш заказ принят в работу.</p>
      <div style="color: var(--brand); font-weight: 700; font-size: 18px; margin: 12px 0;">Заказ ${orderId}</div>
      <p>Менеджер Призма Мебель свяжется с вами по номеру <b>${phone}</b> в течение 30 минут.</p>
      <button class="btn-submit" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('orderModal').classList.remove('open')">Готово</button>
    </div>
  `;
};

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
renderUI();
rebuildSofa();
renderPrice();
updateViewer();
</script>
</body>
</html>
