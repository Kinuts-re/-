<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>СобериДиван — конструктор мягкой мебели</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f4f0; color: #2b2b2b; min-height: 100vh;
  }
  header {
    background: #fff; padding: 16px 32px; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e5e1da; position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 20px; letter-spacing: -0.5px; }
  header h1 span { color: #b5793c; }
  nav a {
    margin-left: 24px; color: #555; text-decoration: none; font-size: 14px;
  }
  nav a:hover { color: #b5793c; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* Галерея */
  .gallery { margin-bottom: 40px; }
  .gallery h2 { font-size: 24px; margin-bottom: 16px; }
  .gallery-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .gallery-item {
    background: #fff; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: transform .2s, box-shadow .2s;
    border: 1px solid #e5e1da;
  }
  .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .gallery-thumb {
    height: 180px; display: flex; align-items: center; justify-content: center;
    font-size: 64px;
  }
  .gallery-item p { padding: 12px; font-size: 14px; text-align: center; }

  /* Конструктор */
  .configurator {
    display: grid; grid-template-columns: 1fr 420px; gap: 24px;
    background: #fff; border-radius: 16px; padding: 24px;
    border: 1px solid #e5e1da;
  }
  @media (max-width: 1000px) { .configurator { grid-template-columns: 1fr; } }

  #viewer {
    background: linear-gradient(180deg, #faf9f7 0%, #eeebe5 100%);
    border-radius: 12px; min-height: 500px; position: relative;
    overflow: hidden;
  }
  .hint {
    position: absolute; bottom: 12px; left: 12px;
    font-size: 12px; color: #888; background: rgba(255,255,255,.8);
    padding: 6px 10px; border-radius: 6px;
  }

  .panel { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-height: 700px; padding-right: 4px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; }

  .model-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .model-btn {
    padding: 10px; border: 2px solid #e5e1da; background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .model-btn:hover { border-color: #c9b79a; }
  .model-btn.active { border-color: #b5793c; background: #fdf6ee; color: #8a5a26; font-weight: 600; }

  .slider-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .slider-group input[type=range] { width: 100%; accent-color: #b5793c; }

  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform .15s;
    position: relative;
  }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch.active { border-color: #2b2b2b; box-shadow: 0 0 0 2px #fff inset; }

  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .option-btn {
    padding: 10px 12px; border: 2px solid #e5e1da; background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    transition: all .15s;
  }
  .option-btn:hover { border-color: #c9b79a; }
  .option-btn.active { border-color: #b5793c; background: #fdf6ee; }
  .option-btn .price-tag { color: #b5793c; font-size: 12px; font-weight: 600; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
  .checkbox-row input { accent-color: #b5793c; width: 18px; height: 18px; }

  /* Цена */
  .price-box {
    position: sticky; bottom: 0; background: #2b2b2b; color: #fff;
    padding: 18px; border-radius: 12px; margin-top: auto;
  }
  .price-total { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
  .price-breakdown { font-size: 12px; color: #aaa; line-height: 1.6; margin-bottom: 12px; }
  .order-btn {
    width: 100%; padding: 14px; background: #b5793c; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .order-btn:hover { background: #a06a2f; }

  /* Модалка */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px; max-width: 500px;
    width: 100%; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin-bottom: 16px; font-size: 22px; }
  .modal input, .modal textarea {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal-summary { background: #f6f4f0; padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 14px; line-height: 1.7; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button {
    flex: 1; padding: 14px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel { background: #eee; color: #555; }
  .btn-submit { background: #b5793c; color: #fff; }
  .success-msg { text-align: center; padding: 20px; }
  .success-msg .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>🛋️ Собери<span>Диван</span></h1>
  <nav>
    <a href="#gallery">Галерея</a>
    <a href="#configurator">Конструктор</a>
    <a href="#">Доставка</a>
    <a href="#">Контакты</a>
  </nav>
</header>

<div class="container">

  <!-- Галерея -->
  <section class="gallery" id="gallery">
    <h2>Готовые работы</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Конструктор -->
  <section class="configurator" id="configurator">
    <div id="viewer">
      <div class="hint">🖱️ Крутите мышкой • Зум колёсиком</div>
    </div>

    <div class="panel">
      <div>
        <h3>Модель</h3>
        <div class="model-selector" id="modelSelector"></div>
      </div>

      <div>
        <h3>Размеры</h3>
        <div class="slider-group">
          <label>Ширина: <span id="wVal">220 см</span></label>
          <input type="range" id="width" min="160" max="320" step="10" value="220" />
        </div>
        <div class="slider-group">
          <label>Глубина: <span id="dVal">95 см</span></label>
          <input type="range" id="depth" min="80" max="120" step="5" value="95" />
        </div>
        <div class="slider-group">
          <label>Высота спинки: <span id="hVal">85 см</span></label>
          <input type="range" id="height" min="70" max="110" step="5" value="85" />
        </div>
      </div>

      <div>
        <h3>Цвет обивки</h3>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div>
        <h3>Ткань</h3>
        <div class="option-list" id="fabricList"></div>
      </div>

      <div>
        <h3>Наполнение</h3>
        <div class="option-list" id="fillerList"></div>
      </div>

      <div>
        <h3>Опции</h3>
        <div class="option-list">
          <label class="checkbox-row">
            <input type="checkbox" id="optArms" checked />
            Подлокотники <span style="margin-left:auto; color:#b5793c; font-size:12px;">+3 000 ₽</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="optMechanism" />
            Механизм «еврокнижка» <span style="margin-left:auto; color:#b5793c; font-size:12px;">+12 000 ₽</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="optStorage" />
            Ящик для белья <span style="margin-left:auto; color:#b5793c; font-size:12px;">+6 000 ₽</span>
          </label>
        </div>
      </div>

      <div class="price-box">
        <div class="price-total" id="totalPrice">0 ₽</div>
        <div class="price-breakdown" id="breakdown"></div>
        <button class="order-btn" onclick="openOrder()">Оформить заказ</button>
      </div>
    </div>
  </section>
</div>

<!-- Модалка оформления -->
<div class="modal-overlay" id="orderModal">
  <div class="modal" id="modalContent">
    <h2>Оформление заказа</h2>
    <input id="fName" placeholder="Имя" required />
    <input id="fPhone" placeholder="Телефон" required />
    <input id="fEmail" placeholder="Email" />
    <textarea id="fAddress" placeholder="Адрес доставки"></textarea>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOrder()">Отмена</button>
      <button class="btn-submit" onclick="submitOrder()">Заказать</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ ДАННЫЕ ============ */

const MODELS = {
  straight: { name: 'Прямой диван', base: 35000, wMin: 160, wMax: 320, wDef: 220 },
  corner:   { name: 'Угловой диван', base: 52000, wMin: 200, wMax: 360, wDef: 280 },
  armchair: { name: 'Кресло', base: 22000, wMin: 80,  wMax: 140, wDef: 100 },
  sofaBed:  { name: 'Диван-кровать', base: 42000, wMin: 180, wMax: 300, wDef: 240 },
};

const COLORS = [
  { id: 'gray',    name: 'Серый',       hex: '#8e8e8e' },
  { id: 'beige',   name: 'Бежевый',     hex: '#c9b79a' },
  { id: 'navy',    name: 'Синий',       hex: '#34495e' },
  { id: 'green',   name: 'Зелёный',     hex: '#5a7d5a' },
  { id: 'brown',   name: 'Коричневый',  hex: '#6b4a2f' },
  { id: 'burgundy',name: 'Бордовый',    hex: '#7a2e3b' },
  { id: 'cream',   name: 'Кремовый',    hex: '#efe6d6' },
  { id: 'black',   name: 'Чёрный',      hex: '#2b2b2b' },
];

const FABRICS = [
  { id: 'rog',      name: 'Рогожка',        mult: 1.0 },
  { id: 'velvet',   name: 'Велюр',          mult: 1.25 },
  { id: 'chenille', name: 'Шенилл',         mult: 1.15 },
  { id: 'leather',  name: 'Экокожа',        mult: 1.4 },
  { id: 'linen',    name: 'Лён',            mult: 1.1 },
];

const FILLERS = [
  { id: 'ppu',     name: 'ППУ стандарт',              add: 0 },
  { id: 'spring',  name: 'ППУ + пружины',             add: 4000 },
  { id: 'memory',  name: 'Пружинный блок + память',   add: 9000 },
];

/* ============ СОСТОЯНИЕ ============ */

const state = {
  model: 'straight',
  width: 220,
  depth: 95,
  height: 85,
  color: 'gray',
  fabric: 'rog',
  filler: 'ppu',
  arms: true,
  mechanism: false,
  storage: false,
};

/* ============ THREE.JS СЦЕНА ============ */

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(4, 3, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2.1;

// Свет
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);

// Пол
const floorGeo = new THREE.CircleGeometry(8, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.9 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Группа дивана
const sofaGroup = new THREE.Group();
scene.add(sofaGroup);

function makeMaterial() {
  const colorHex = COLORS.find(c => c.id === state.color).hex;
  const fabricId = state.fabric;
  const isLeather = fabricId === 'leather';
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(colorHex),
    roughness: isLeather ? 0.35 : 0.85,
    metalness: isLeather ? 0.05 : 0,
  });
}

function createBox(w, h, d, mat) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* Пересобрать диван из примитивов */
function rebuildSofa() {
  // Очистить
  while (sofaGroup.children.length) {
    const c = sofaGroup.children[0];
    sofaGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
  }

  const mat = makeMaterial();
  const w = state.width / 100;    // метры
  const d = state.depth / 100;
  const h = state.height / 100;
  const seatH = 0.42;
  const seatThick = 0.18;
  const armThick = 0.18;
  const backThick = 0.18;

  const isCorner = state.model === 'corner';

  if (isCorner) {
    // Угловой: L-образный — основная часть + боковая
    const mainW = w * 0.62;
    const sideW = w - mainW;

    // База основной части
    const base = createBox(mainW, seatH - seatThick, d, mat);
    base.position.set(-(sideW/2), (seatH - seatThick)/2, 0);
    sofaGroup.add(base);

    // Сиденье основной
    const seat = createBox(mainW - 0.04, seatThick, d - 0.04, mat);
    seat.position.set(-(sideW/2), seatH - seatThick/2, 0);
    sofaGroup.add(seat);

    // Спинка основной
    const back = createBox(mainW, h - seatH, backThick, mat);
    back.position.set(-(sideW/2), seatH + (h - seatH)/2, -d/2 + backThick/2);
    sofaGroup.add(back);

    // Боковая часть (перпендикулярно)
    const sideBase = createBox(sideW, seatH - seatThick, d * 0.85, mat);
    sideBase.position.set(mainW/2 - 0.02, (seatH - seatThick)/2, d * 0.1);
    sofaGroup.add(sideBase);

    const sideSeat = createBox(sideW - 0.04, seatThick, d * 0.85 - 0.04, mat);
    sideSeat.position.set(mainW/2 - 0.02, seatH - seatThick/2, d * 0.1);
    sofaGroup.add(sideSeat);

    const sideBack = createBox(backThick, h - seatH, d * 0.85, mat);
    sideBack.position.set(mainW/2 - backThick/2, seatH + (h - seatH)/2, d * 0.1);
    sofaGroup.add(sideBack);

    // Внешний подлокотник основной части (если включено)
    if (state.arms) {
      const arm = createBox(armThick, h * 0.55, d, mat);
      arm.position.set(-mainW + armThick/2 - sideW/2, h * 0.55 / 2 + seatH - seatH, 0);
      arm.position.y = (h * 0.55) / 2 + (seatH - h*0.55/2);
      // проще: подлокотник от пола до высоты
      arm.position.set(-mainW + armThick/2 - sideW/2, h * 0.55 / 2, 0);
      sofaGroup.add(arm);
    }
  } else {
    // Прямой / кресло / диван-кровать
    const armW = state.arms ? armThick : 0;
    const innerW = w - armW * 2;

    // База (низ)
    const base = createBox(w, seatH - seatThick, d, mat);
    base.position.set(0, (seatH - seatThick)/2, 0);
    sofaGroup.add(base);

    // Сиденье
    const seat = createBox(innerW - 0.04, seatThick, d - backThick - 0.04, mat);
    seat.position.set(0, seatH - seatThick/2, backThick/2);
    sofaGroup.add(seat);

    // Спинка
    const back = createBox(innerW, h - seatH, backThick, mat);
    back.position.set(0, seatH + (h - seatH)/2, -d/2 + backThick/2);
    sofaGroup.add(back);

    // Подлокотники
    if (state.arms) {
      const armL = createBox(armThick, h * 0.65, d, mat);
      armL.position.set(-w/2 + armThick/2, (h * 0.65)/2, 0);
      sofaGroup.add(armL);

      const armR = createBox(armThick, h * 0.65, d, mat);
      armR.position.set(w/2 - armThick/2, (h * 0.65)/2, 0);
      sofaGroup.add(armR);
    }
  }

  // Декоративные подушки на спинке
  const pillowMat = makeMaterial();
  pillowMat.color.offsetHSL(0, 0, 0.06);
  const pillowW = 0.38;
  const pillowCount = state.model === 'armchair' ? 1 : 2;
  const pillowStartX = state.model === 'corner' ? -(w*0.3) : (state.arms ? -(w/2 - 0.4) : -(w/2 - 0.25));
  for (let i = 0; i < pillowCount; i++) {
    const pillow = createBox(pillowW, 0.32, 0.12, pillowMat);
    pillow.position.set(
      pillowStartX + i * (pillowW + 0.15),
      seatH + 0.22,
      -d/2 + backThick + 0.08
    );
    pillow.rotation.x = 0.15;
    sofaGroup.add(pillow);
  }

  // Центрируем всю группу
  sofaGroup.position.set(0, 0, 0);
}

/* ============ РАСЧЁТ ЦЕНЫ ============ */

function calculatePrice() {
  const model = MODELS[state.model];
  const fabric = FABRICS.find(f => f.id === state.fabric);
  const filler = FILLERS.find(f => f.id === state.filler);

  // Базовая
  let base = model.base;

  // Размер: надбавка за см ширины и глубины сверх дефолта
  const wExtra = (state.width - model.wDef) * 80;
  const dExtra = (state.depth - 95) * 150;
  const hExtra = (state.height - 85) * 100;
  const sizeAdd = Math.max(wExtra, 0) + Math.max(dExtra, 0) + Math.max(hExtra, 0);

  // Множитель ткани применяется к базе+размеру
  const fabricMult = fabric.mult;
  const beforeFabric = base + sizeAdd;
  const afterFabric = beforeFabric * fabricMult;
  const fabricAdd = afterFabric - beforeFabric;

  // Наполнение
  const fillerAdd = filler.add;

  // Опции
  let armsAdd = 0;
  let mechAdd = 0;
  let storageAdd = 0;
  if (state.arms) armsAdd = 3000;
  if (state.mechanism) mechAdd = 12000;
  if (state.storage) storageAdd = 6000;

  const total = Math.round(afterFabric + fillerAdd + armsAdd + mechAdd + storageAdd);

  return {
    base,
    sizeAdd,
    fabricAdd,
    fillerAdd,
    armsAdd,
    mechAdd,
    storageAdd,
    total,
  };
}

function renderPrice() {
  const p = calculatePrice();
  document.getElementById('totalPrice').textContent = p.total.toLocaleString('ru-RU') + ' ₽';

  const breakdown = [];
  breakdown.push(`Базовая модель: ${p.base.toLocaleString('ru-RU')} ₽`);
  if (p.sizeAdd > 0) breakdown.push(`Увеличение размера: +${p.sizeAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fabricAdd !== 0) breakdown.push(`Ткань: ${p.fabricAdd > 0 ? '+' : ''}${p.fabricAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fillerAdd > 0) breakdown.push(`Наполнение: +${p.fillerAdd.toLocaleString('ru-RU')} ₽`);
  if (p.armsAdd > 0) breakdown.push(`Подлокотники: +${p.armsAdd.toLocaleString('ru-RU')} ₽`);
  if (p.mechAdd > 0) breakdown.push(`Механизм: +${p.mechAdd.toLocaleString('ru-RU')} ₽`);
  if (p.storageAdd > 0) breakdown.push(`Ящик: +${p.storageAdd.toLocaleString('ru-RU')} ₽`);

  document.getElementById('breakdown').innerHTML = breakdown.join('<br>');
}

/* ============ UI РЕНДЕР ============ */

function renderModelSelector() {
  const container = document.getElementById('modelSelector');
  container.innerHTML = '';
  Object.entries(MODELS).forEach(([id, m]) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn' + (state.model === id ? ' active' : '');
    btn.textContent = m.name;
    btn.onclick = () => {
      state.model = id;
      // Обновить диапазон ширины
      const wInput = document.getElementById('width');
      wInput.min = m.wMin;
      wInput.max = m.wMax;
      state.width = Math.min(Math.max(state.width, m.wMin), m.wMax);
      wInput.value = state.width;
      document.getElementById('wVal').textContent = state.width + ' см';

      renderModelSelector();
      rebuildSofa();
      renderPrice();
    };
    container.appendChild(btn);
  });
}

function renderColors() {
  const container = document.getElementById('colorGrid');
  container.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (state.color === c.id ? ' active' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    sw.onclick = () => {
      state.color = c.id;
      renderColors();
      rebuildSofa();
    };
    container.appendChild(sw);
  });
}
