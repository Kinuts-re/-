<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Призма Мебель — конструктор мягкой мебели</title>
<style>
  /* Зеленая палитра */
  :root {
    --brand: #2e7d32;       /* Основной зеленый */
    --brand-light: #4caf50; /* Светло-зеленый */
    --brand-dark: #1b5e20;  /* Темно-зеленый */
    --ink: #212121;
    --muted: #757575;
    --line: #e0e0e0;
    --bg: #f1f8e9;          /* Очень светлый зеленоватый фон */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  
  header { background: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo-mark { width: 34px; height: 34px; background: var(--brand); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .logo-text { font-weight: 700; font-size: 19px; letter-spacing: -0.5px; }
  .logo-text small { display: block; font-size: 10px; letter-spacing: 3px; color: var(--brand); font-weight: 600; }
  
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .hero { background: linear-gradient(135deg, #fff 0%, #e8f5e9 100%); border-radius: 20px; padding: 40px 32px; margin-bottom: 32px; border: 1px solid var(--line); text-align: center; }
  .hero h1 { font-size: 34px; margin-bottom: 12px; }
  .hero h1 span { color: var(--brand); }
  .hero p { color: var(--muted); font-size: 16px; }

  .configurator { display: grid; grid-template-columns: 1fr 420px; gap: 24px; background: #fff; border-radius: 16px; padding: 24px; border: 1px solid var(--line); margin-bottom: 40px; }
  @media (max-width: 1000px) { .configurator { grid-template-columns: 1fr; padding: 12px; } }

  #viewer { background: linear-gradient(180deg, #f9fbe7 0%, #e8f5e9 100%); border-radius: 12px; min-height: 500px; position: relative; overflow: hidden; }
  .hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; pointer-events: none; z-index: 10; }
  .viewer-title { position: absolute; top: 12px; left: 12px; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; z-index: 10; }
  
  .panel { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-height: 700px; padding-right: 4px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt-btn { padding: 10px; border: 2px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; font-family: inherit; text-align: center; }
  .opt-btn:hover { border-color: #a5d6a7; }
  .opt-btn.active { border-color: var(--brand); background: #e8f5e9; color: var(--brand-dark); font-weight: 600; }

  .slider-group { margin-bottom: 12px; }
  .slider-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .slider-group label span { color: var(--brand); font-weight: 600; }
  .slider-group input[type=range] { width: 100%; accent-color: var(--brand); }

  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch.active { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }

  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .list-btn { padding: 10px 12px; border: 2px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: all .15s; font-family: inherit; width: 100%; }
  .list-btn:hover { border-color: #a5d6a7; }
  .list-btn.active { border-color: var(--brand); background: #e8f5e9; }
  .list-btn .price-tag { color: var(--brand); font-size: 12px; font-weight: 600; }

  .price-box { position: sticky; bottom: 0; background: var(--ink); color: #fff; padding: 18px; border-radius: 12px; margin-top: auto; }
  .price-total { font-size: 32px; font-weight: 700; margin-bottom: 4px; color: #b9f6ca; }
  .price-breakdown { font-size: 12px; color: #aaa; line-height: 1.6; margin-bottom: 12px; }
  .order-btn { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .order-btn:hover { background: var(--brand-dark); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 32px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; font-size: 22px; }
  .modal input, .modal textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal-summary { background: var(--bg); padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 13px; line-height: 1.7; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #eee; color: #555; }
  .btn-submit { background: var(--brand); color: #fff; }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-mark"></div>
    <div class="logo-text">ПРИЗМА<small>МЕБЕЛЬ</small></div>
  </a>
</header>

<div class="container">
  <section class="hero">
    <h1>Соберите диван <span>своей мечты</span></h1>
    <p>Выбирайте модель, размеры, текстуру и конструкцию — мы покажем цену и сошьём под вас.</p>
  </section>

  <section class="configurator">
    <div id="viewer">
      <div class="viewer-title" id="viewerTitle">Прямой диван «Осло»</div>
      <div class="hint">🖱️ Зажмите мышкой для вращения</div>
    </div>

    <div class="panel">
      <div>
        <h3>Модель</h3>
        <div class="grid-2" id="modelSelector"></div>
      </div>

      <div>
        <h3>Размеры</h3>
        <div class="slider-group">
          <label>Ширина <span id="wVal">220 см</span></label>
          <input type="range" id="width" min="160" max="320" step="10" value="220" />
        </div>
        <div class="slider-group">
          <label>Глубина <span id="dVal">95 см</span></label>
          <input type="range" id="depth" min="80" max="120" step="5" value="95" />
        </div>
        <div class="slider-group">
          <label>Высота спинки <span id="hVal">85 см</span></label>
          <input type="range" id="height" min="70" max="110" step="5" value="85" />
        </div>
      </div>

      <div>
        <h3>Конструкция</h3>
        <div class="option-list">
          <div style="font-size:12px; color:#888; margin-bottom:4px;">Подлокотники:</div>
          <div class="grid-2" id="armTypeSelector">
            <button class="opt-btn" data-val="square">Прямые</button>
            <button class="opt-btn" data-val="rounded">Мягкие</button>
            <button class="opt-btn" data-val="none" style="grid-column: span 2">Без подлокотников</button>
          </div>
          <div style="font-size:12px; color:#888; margin:8px 0 4px;">Спинка:</div>
          <div class="grid-2" id="backTypeSelector">
            <button class="opt-btn" data-val="straight">Прямая</button>
            <button class="opt-btn" data-val="tilted">С наклоном</button>
          </div>
        </div>
      </div>

      <div>
        <h3>Механизм</h3>
        <div class="option-list" id="mechanismList"></div>
      </div>

      <div>
        <h3>Наполнение</h3>
        <div class="option-list" id="fillerList"></div>
      </div>

      <div>
        <h3>Цвет обивки</h3>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div>
        <h3>Ткань и текстура</h3>
        <div class="option-list" id="fabricList"></div>
      </div>

      <div class="price-box">
        <div class="price-total" id="totalPrice">0 ₽</div>
        <div class="price-breakdown" id="breakdown"></div>
        <button class="order-btn" onclick="openOrder()">Оформить заказ</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Подключаем Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============ ДАННЫЕ ============ */
const MODELS = {
  straight: { name: 'Прямой диван', fullName: 'Прямой диван «Осло»', base: 35000, wMin: 160, wMax: 320, wDef: 220 },
  corner:   { name: 'Угловой диван', fullName: 'Угловой диван «Берген»', base: 52000, wMin: 200, wMax: 360, wDef: 280 },
  armchair: { name: 'Кресло', fullName: 'Кресло «Токио»', base: 22000, wMin: 80,  wMax: 140, wDef: 100 },
  sofaBed:  { name: 'Диван-кровать', fullName: 'Диван-кровать «Милан»', base: 42000, wMin: 180, wMax: 300, wDef: 240 },
};

const COLORS = [
  { id: 'gray',     name: 'Серый',      hex: '#9e9e9e' },
  { id: 'beige',    name: 'Бежевый',    hex: '#d7ccc8' },
  { id: 'navy',     name: 'Синий',      hex: '#34495e' },
  { id: 'green',    name: 'Зелёный',    hex: '#4caf50' },
  { id: 'brown',    name: 'Коричневый', hex: '#795548' },
  { id: 'burgundy', name: 'Бордовый',   hex: '#880e4f' },
  { id: 'cream',    name: 'Кремовый',   hex: '#f5f5dc' },
  { id: 'black',    name: 'Чёрный',     hex: '#212121' },
];

const FABRICS = [
  { id: 'rog',      name: 'Рогожка',  mult: 1.0,  desc: 'Крупное плетение' },
  { id: 'velvet',   name: 'Велюр',    mult: 1.25, desc: 'Мягкий ворс' },
  { id: 'linen',    name: 'Лён',      mult: 1.1,  desc: 'Мелкая фактура' },
  { id: 'leather',  name: 'Экокожа',  mult: 1.4,  desc: 'Гладкая, глянцевая' },
];

const MECHANISMS = [
  { id: 'none',     name: 'Статичный',          add: 0,     desc: 'Обычный диван' },
  { id: 'euro',     name: 'Еврокнижка',         add: 12000, desc: 'Раскладывается вперед' },
  { id: 'accordion',name: 'Аккордеон',          add: 15000, desc: 'Раскладывается в 3 шага' },
  { id: 'pullout',  name: 'Выкатной (дельфин)', add: 18000, desc: 'Выезжает вперед' },
];

const FILLERS = [
  { id: 'ppu',    name: 'ППУ стандарт',            add: 0,    desc: 'Базовый комфорт' },
  { id: 'spring', name: 'ППУ + пружины',           add: 4000, desc: 'Упругость' },
  { id: 'memory', name: 'Пружинный блок + память', add: 9000, desc: 'Премиум-комфорт' },
];

/* ============ СОСТОЯНИЕ ============ */
const state = {
  model: 'straight', width: 220, depth: 95, height: 85,
  color: 'gray', fabric: 'rog', 
  armType: 'square', backType: 'straight',
  mechanism: 'none', filler: 'ppu',
};

/* ============ ГЕНЕРАЦИЯ ТЕКСТУР ============ */
function createTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 256, 256);

  if (type === 'velvet') {
    for (let i = 0; i < 5000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.05)';
      ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
    }
  } else if (type === 'rog') {
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 256; i += 8) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
    }
  } else if (type === 'linen') {
    ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    for (let i = 0; i < 256; i += 4) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
    }
  } else if (type === 'leather') {
    for (let i = 0; i < 500; i++) {
      ctx.fillStyle = 'rgba(0,0,0,0.02)';
      ctx.beginPath(); ctx.arc(Math.random()*256, Math.random()*256, Math.random()*3, 0, Math.PI*2); ctx.fill();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 4); 
  return texture;
}

const textures = {
  rog: createTexture('rog'),
  velvet: createTexture('velvet'),
  linen: createTexture('linen'),
  leather: createTexture('leather')
};

/* ============ THREE.JS СЦЕНА ============ */
const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1f8e9);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(4, 3, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewer.appendChild(renderer.domElement);
renderer.domElement.style.borderRadius = '12px';

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI / 2.1; 
controls.target.set(0, 0.4, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshStandardMaterial({ color: 0xdcf0d5, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const sofaGroup = new THREE.Group();
scene.add(sofaGroup);

function makeMaterial(lighten = 0) {
  const colorHex = COLORS.find(c => c.id === state.color).hex;
  const isLeather = state.fabric === 'leather';
  
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(colorHex),
    map: textures[state.fabric],
    roughness: isLeather ? 0.3 : 0.9,
    metalness: isLeather ? 0.1 : 0,
  });
  if (lighten) mat.color.offsetHSL(0, 0, lighten);
  return mat;
}

function createSoftBox(w, h, d, mat, isRounded = true) {
  const geo = isRounded ? new RoundedBoxGeometry(w, h, d, 4, 0.04) : new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function rebuildSofa() {
  while (sofaGroup.children.length) {
    const c = sofaGroup.children[0];
    sofaGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
  }

  const mat = makeMaterial();
  const isRounded = state.armType === 'rounded';
  const isTilted = state.backType === 'tilted';
  
  const w = state.width / 100;
  const d = state.depth / 100;
  const h = state.height / 100;
  const seatH = 0.42;
  const seatThick = 0.20;
  const armThick = 0.20;
  const backThick = 0.20;

  const legMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.6 });
  const pillowMat = makeMaterial(0.05);

  function addLegs(x, z, width, depth) {
    const legGeo = new THREE.CylinderGeometry(0.03, 0.02, 0.15, 8);
    const offsets = [
      { x: -width/2 + 0.1, z: -depth/2 + 0.1 },
      { x: width/2 - 0.1,  z: -depth/2 + 0.1 },
      { x: -width/2 + 0.1, z: depth/2 - 0.1 },
      { x: width/2 - 0.1,  z: depth/2 - 0.1 }
    ];
    offsets.forEach(o => {
      const leg = new THREE.Mesh(legGeo, legMat);
      leg.position.set(x + o.x, 0.075, z + o.z);
      leg.castShadow = true;
      sofaGroup.add(leg);
    });
  }

  if (state.model === 'corner') {
    // ПРАВИЛЬНЫЙ УГЛОВОЙ ДИВАН (Г-образный монолит)
    // Основное сиденье (слева) и приставное (справа)
    const mainW = w * 0.65;
    const sideW = w - mainW;
    
    // 1. Основания (базы)
    const baseL = createSoftBox(mainW, seatH - seatThick, d, mat);
    baseL.position.set(-(sideW / 2), (seatH - seatThick) / 2 + 0.15, 0);
    sofaGroup.add(baseL);
    addLegs(-(sideW / 2), 0, mainW, d);

    // Приставная часть базы (стыкуется с основной без зазоров)
    const baseR = createSoftBox(sideW, seatH - seatThick, d * 0.85, mat);
    // Сдвигаем так, чтобы она плотно прилегала к правому краю основной
    baseR.position.set(mainW / 2, (seatH - seatThick) / 2 + 0.15, d * 0.1);
    sofaGroup.add(baseR);
    addLegs(mainW / 2, d * 0.1, sideW, d * 0.85);

    // 2. Сиденья
    const seatL = createSoftBox(mainW - 0.04, seatThick, d - 0.04, mat, isRounded);
    seatL.position.set(-(sideW / 2), seatH - seatThick / 2 + 0.15, 0);
    sofaGroup.add(seatL);

    const seatR = createSoftBox(sideW - 0.04, seatThick, d * 0.85 - 0.04, mat, isRounded);
    seatR.position.set(mainW / 2, seatH - seatThick / 2 + 0.15, d * 0.1);
    sofaGroup.add(seatR);

    // 3. Спинки
    // Левая (длинная)
    const backL = createSoftBox(mainW, h - seatH, backThick, mat, isRounded);
    backL.position.set(-(sideW / 2), seatH + (h - seatH) / 2 + 0.15, -d / 2 + backThick / 2);
    if (isTilted) backL.rotation.x = -0.1;
    sofaGroup.add(backL);

    // Правая (короткая, повернута на 90 градусов)
    const backR = createSoftBox(sideW, h - seatH, backThick, mat, isRounded);
    // Ставим её сбоку от правой базы (создаем угол)
    backR.position.set(mainW / 2 + sideW / 2 - backThick / 2, seatH + (h - seatH) / 2 + 0.15, d * 0.1);
    backR.rotation.y = Math.PI / 2; // Поворот
    if (isTilted) backR.rotation.z = 0.1; // Наклон для правой части
    sofaGroup.add(backR);

    // 4. Подлокотник (только внешний левый)
    if (state.armType !== 'none') {
      const arm = createSoftBox(armThick, h * 0.6, d, mat, isRounded);
      arm.position.set(-mainW - sideW/2 + armThick / 2, (h * 0.6) / 2 + 0.15, 0);
      sofaGroup.add(arm);
    }

    // 5. Подушки
    const pillowW = 0.4;
    for (let i = 0; i < 2; i++) {
      const p = createSoftBox(pillowW, 0.35, 0.15, pillowMat, true);
      p.position.set(-mainW + 0.3 + i*(pillowW+0.1), seatH + 0.25, -d/2 + backThick + 0.1);
      p.rotation.x = 0.15;
      sofaGroup.add(p);
    }
    
  } else {
    // Прямой диван / кресло
    const armW = state.armType !== 'none' ? armThick : 0;
    const innerW = w - armW * 2;

    const base = createSoftBox(w, seatH - seatThick, d, mat);
    base.position.set(0, (seatH - seatThick) / 2 + 0.15, 0);
    sofaGroup.add(base);
    addLegs(0, 0, w, d);

    const seat = createSoftBox(innerW - 0.04, seatThick, d - backThick - 0.04, mat, isRounded);
    seat.position.set(0, seatH - seatThick / 2 + 0.15, backThick / 2);
    sofaGroup.add(seat);

    const back = createSoftBox(innerW, h - seatH, backThick, mat, isRounded);
    back.position.set(0, seatH + (h - seatH) / 2 + 0.15, -d / 2 + backThick / 2);
    if (isTilted) back.rotation.x = -0.1;
    sofaGroup.add(back);

    if (state.armType !== 'none') {
      const armL = createSoftBox(armThick, h * 0.6, d, mat, isRounded);
      armL.position.set(-w / 2 + armThick / 2, (h * 0.6) / 2 + 0.15, 0);
      sofaGroup.add(armL);

      const armR = createSoftBox(armThick, h * 0.6, d, mat, isRounded);
      armR.position.set(w / 2 - armThick / 2, (h * 0.6) / 2 + 0.15, 0);
      sofaGroup.add(armR);
    }

    const pillowW = 0.4;
    const pCount = state.model === 'armchair' ? 1 : 2;
    const startX = armW > 0 ? -(w/2 - armW - pillowW/2 - 0.1) : -(w/2 - pillowW/2 - 0.1);
    for (let i = 0; i < pCount; i++) {
      const p = createSoftBox(pillowW, 0.35, 0.15, pillowMat, true);
      p.position.set(startX + i*(pillowW+0.2), seatH + 0.25, -d/2 + backThick + 0.1);
      p.rotation.x = 0.15;
      sofaGroup.add(p);
    }
  }

  const camDist = Math.max(w, d) * 1.6 + 2.5;
  camera.position.set(camDist * 0.6, camDist * 0.5, camDist * 0.8);
  controls.target.set(0, h * 0.4, 0);
  controls.update();
}

/* ============ ЦЕНА ============ */
function calculatePrice() {
  const model = MODELS[state.model];
  const fabric = FABRICS.find(f => f.id === state.fabric);
  const mech = MECHANISMS.find(m => m.id === state.mechanism);
  const filler = FILLERS.find(f => f.id === state.filler);

  const base = model.base;
  const sizeAdd = Math.max((state.width - model.wDef) * 80, 0) + 
                  Math.max((state.depth - 95) * 150, 0) + 
                  Math.max((state.height - 85) * 100, 0);
  
  const beforeFabric = base + sizeAdd;
  const afterFabric = beforeFabric * fabric.mult;
  const fabricAdd = Math.round(afterFabric - beforeFabric);
  
  const armsAdd = state.armType !== 'none' ? 3000 : 0;
  const mechAdd = mech.add;
  const fillerAdd = filler.add;

  const total = Math.round(afterFabric + armsAdd + mechAdd + fillerAdd);

  return { base, sizeAdd, fabricAdd, armsAdd, mechAdd, fillerAdd, total };
}

function renderPrice() {
  const p = calculatePrice();
  document.getElementById('totalPrice').textContent = p.total.toLocaleString('ru-RU') + ' ₽';
  
  let b = [`Базовая: ${p.base.toLocaleString('ru-RU')} ₽`];
  if (p.sizeAdd > 0) b.push(`Размер: +${p.sizeAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fabricAdd > 0) b.push(`Ткань: +${p.fabricAdd.toLocaleString('ru-RU')} ₽`);
  if (p.armsAdd > 0) b.push(`Подлокотники: +${p.armsAdd.toLocaleString('ru-RU')} ₽`);
  if (p.mechAdd > 0) b.push(`Механизм: +${p.mechAdd.toLocaleString('ru-RU')} ₽`);
  if (p.fillerAdd > 0) b.push(`Наполнение: +${p.fillerAdd.toLocaleString('ru-RU')} ₽`);

  document.getElementById('breakdown').innerHTML = b.join('<br>');
}

/* ============ UI ============ */
function renderUI() {
  const mCont = document.getElementById('modelSelector');
  mCont.innerHTML = '';
  Object.entries(MODELS).forEach(([id, m]) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (state.model === id ? ' active' : '');
    btn.textContent = m.name;
    btn.onclick = () => {
      state.model = id;
      const wInput = document.getElementById('width');
      wInput.min = m.wMin; wInput.max = m.wMax;
      state.width = Math.min(Math.max(state.width, m.wMin), m.wMax);
      wInput.value = state.width;
      document.getElementById('wVal').textContent = state.width + ' см';
      document.getElementById('viewerTitle').textContent = m.fullName;
      renderUI(); rebuildSofa(); renderPrice();
    };
    mCont.appendChild(btn);
  });

  const armCont = document.getElementById('armTypeSelector');
  armCont.innerHTML = `
    <button class="opt-btn ${state.armType==='square'?'active':''}" data-val="square">Прямые</button>
    <button class="opt-btn ${state.armType==='rounded'?'active':''}" data-val="rounded">Мягкие</button>
    <button class="opt-btn ${state.armType==='none'?'active':''}" data-val="none" style="grid-column: span 2">Без подлокотников</button>
  `;
  armCont.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state.armType = btn.dataset.val; renderUI(); rebuildSofa(); renderPrice(); };
  });

  const backCont = document.getElementById('backTypeSelector');
  backCont.innerHTML = `
    <button class="opt-btn ${state.backType==='straight'?'active':''}" data-val="straight">Прямая</button>
    <button class="opt-btn ${state.backType==='tilted'?'active':''}" data-val="tilted">С наклоном</button>
  `;
  backCont.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state.backType = btn.dataset.val; renderUI(); rebuildSofa(); };
  });

  // Механизмы
  const mechCont = document.getElementById('mechanismList');
  mechCont.innerHTML = '';
  MECHANISMS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'list-btn' + (state.mechanism === m.id ? ' active' : '');
    btn.innerHTML = `<span><b>${m.name}</b><br><small style="color:#888">${m.desc}</small></span><span class="price-tag">${m.add === 0 ? 'вкл.' : '+'+m.add.toLocaleString('ru-RU')+' ₽'}</span>`;
    btn.onclick = () => { state.mechanism = m.id; renderUI(); renderPrice(); };
    mechCont.appendChild(btn);
  });

  // Наполнение
  const fillCont = document.getElementById('fillerList');
  fillCont.innerHTML = '';
  FILLERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'list-btn' + (state.filler === f.id ? ' active' : '');
    btn.innerHTML = `<span><b>${f.name}</b><br><small style="color:#888">${f.desc}</small></span><span class="price-tag">${f.add === 0 ? 'вкл.' : '+'+f.add.toLocaleString('ru-RU')+' ₽'}</span>`;
    btn.onclick = () => { state.filler = f.id; renderUI(); renderPrice(); };
    fillCont.appendChild(btn);
  });

  // Цвета
  const cCont = document.getElementById('colorGrid');
  cCont.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (state.color === c.id ? ' active' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    sw.onclick = () => { state.color = c.id; renderUI(); rebuildSofa(); };
    cCont.appendChild(sw);
  });

  // Ткани
  const fCont = document.getElementById('fabricList');
  fCont.innerHTML = '';
  FABRICS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'list-btn' + (state.fabric === f.id ? ' active' : '');
    btn.innerHTML = `<span><b>${f.name}</b><br><small style="color:#888">${f.desc}</small></span><span class="price-tag">${f.mult === 1 ? 'базовая' : '×'+f.mult}</span>`;
    btn.onclick = () => { state.fabric = f.id; renderUI(); rebuildSofa(); renderPrice(); };
    fCont.appendChild(btn);
  });
}

/* ============ СОБЫТИЯ ============ */
document.getElementById('width').addEventListener('input', e => {
  state.width = +e.target.value;
  document.getElementById('wVal').textContent = state.width + ' см';
  rebuildSofa(); renderPrice();
});
document.getElementById('depth').addEventListener('input', e => {
  state.depth = +e.target.value;
  document.getElementById('dVal').textContent = state.depth + ' см';
  rebuildSofa(); renderPrice();
});
document.getElementById('height').addEventListener('input', e => {
  state.height = +e.target.value;
  document.getElementById('hVal').textContent = state.height + ' см';
  rebuildSofa(); renderPrice();
});

/* ============ МОДАЛКА ============ */
const modal = document.getElementById('orderModal');
const modalContent = document.getElementById('modalContent');

window.openOrder = function() {
  const p = calculatePrice();
  const model = MODELS[state.model];
  const color = COLORS.find(c => c.id === state.color);
  
  modalContent.innerHTML = `
    <h2>Оформление заказа</h2>
    <input id="fName" placeholder="Имя" />
    <input id="fPhone" placeholder="Телефон" />
    <input id="fEmail" placeholder="Email (необязательно)" />
    <textarea id="fAddress" placeholder="Адрес доставки"></textarea>
    
    <div class="modal-summary">
      <div><b>Модель:</b> ${model.fullName}</div>
      <div><b>Размер:</b> ${state.width}×${state.depth}×${state.height} см</div>
      <div><b>Цвет:</b> ${color.name}</div>
      <div><b>Итого:</b> ${p.total.toLocaleString('ru-RU')} ₽</div>
    </div>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('orderModal').classList.remove('open')">Отмена</button>
      <button class="btn-submit" onclick="submitOrder()">Заказать</button>
    </div>
  `;
  modal.classList.add('open');
};

window.submitOrder = function() {
  const name = document.getElementById('fName').value;
  const phone = document.getElementById('fPhone').value;
  
  if (!name || !phone) { alert('Пожалуйста, заполните имя и телефон'); return; }
  
  const orderId = 'ПРЗ-' + Date.now().toString().slice(-6);
  
  modalContent.innerHTML = `
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 56px; margin-bottom: 12px;">✅</div>
      <h2>Спасибо, ${name}!</h2>
      <p>Ваш заказ принят в работу.</p>
      <div style="color: var(--brand); font-weight: 700; font-size: 18px; margin: 12px 0;">Заказ ${orderId}</div>
      <p>Менеджер Призма Мебель свяжется с вами по номеру <b>${phone}</b> в течение 30 минут.</p>
      <button class="btn-submit" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('orderModal').classList.remove('open')">Готово</button>
    </div>
  `;
};

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
function resize() {
  const r = viewer.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

renderUI();
rebuildSofa();
renderPrice();
resize();
animate();
</script>
